<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d"><title id="t">Visual Tracing pipeline</title><desc id="d">Conceptual data flow from scene geometry and material data through visibility history and visual tracing resolve into a vibrant frame.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#08101f"/><stop offset="1" stop-color="#21143c"/></linearGradient><linearGradient id="gl" x1="0" x2="1"><stop stop-color="#4ff3d0"/><stop offset="1" stop-color="#b665ff"/></linearGradient></defs><rect width="1200" height="480" rx="24" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial" text-anchor="middle"><text x="600" y="48" fill="#f4f7ff" font-size="30" font-weight="700">VS ENGINE · VISUAL TRACING</text><text x="600" y="78" fill="#aabbe0" font-size="16">Raster-informed scene analysis and temporal visual reconstruction</text>
<g stroke="url(#gl)" stroke-width="3" fill="#111e38"><rect x="40" y="155" width="205" height="135" rx="16"/><rect x="285" y="155" width="205" height="135" rx="16"/><rect x="530" y="155" width="205" height="135" rx="16"/><rect x="775" y="155" width="205" height="135" rx="16"/><rect x="1020" y="155" width="140" height="135" rx="16"/></g>
<g fill="#f2f6ff" font-size="18" font-weight="700"><text x="142" y="199">Scene Data</text><text x="387" y="199">Visibility</text><text x="632" y="199">History Buffers</text><text x="877" y="199">Trace Resolve</text><text x="1090" y="199">Frame</text></g><g fill="#aebfe4" font-size="14"><text x="142" y="229">Geometry · Materials</text><text x="142" y="251">Depth · Normals</text><text x="387" y="229">Screen / Scene</text><text x="387" y="251">Selection</text><text x="632" y="229">Temporal Samples</text><text x="632" y="251">Reprojection</text><text x="877" y="229">Filtering · Blend</text><text x="877" y="251">Confidence</text><text x="1090" y="229">Vivid</text><text x="1090" y="251">Output</text></g><g stroke="url(#gl)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M245 222H280l-8 -8m8 8l-8 8"/><path d="M490 222H525l-8 -8m8 8l-8 8"/><path d="M735 222H770l-8 -8m8 8l-8 8"/><path d="M980 222H1015l-8 -8m8 8l-8 8"/></g><text x="600" y="355" fill="#d8e5ff" font-size="17">Visual Tracing is a distinct VS Engine rendering workflow; it is not ray tracing.</text><text x="600" y="388" fill="#9aafd6" font-size="14">Exact techniques depend on the renderer profile, target GPU, and available frame data.</text></g></svg>
