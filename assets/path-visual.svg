<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d"><title id="t">Path Visual architecture</title><desc id="d">A conceptual path visualization pipeline linking world-space anchors, route graph, camera intent, visual corridor and final composited presentation.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#08101f"/><stop offset="1" stop-color="#21143c"/></linearGradient><linearGradient id="gl" x1="0" x2="1"><stop stop-color="#4ff3d0"/><stop offset="1" stop-color="#b665ff"/></linearGradient></defs><rect width="1200" height="480" rx="24" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial" text-anchor="middle"><text x="600" y="48" fill="#f4f7ff" font-size="30" font-weight="700">VS ENGINE · PATH VISUAL</text><text x="600" y="78" fill="#aabbe0" font-size="16">Spatial path, visibility corridor, and presentation guidance</text>
<g fill="#111e38" stroke="url(#gl)" stroke-width="3"><rect x="45" y="145" width="230" height="150" rx="16"/><rect x="325" y="145" width="230" height="150" rx="16"/><rect x="605" y="145" width="230" height="150" rx="16"/><rect x="885" y="145" width="270" height="150" rx="16"/></g>
<g fill="#f2f6ff" font-size="18" font-weight="700"><text x="160" y="188">World Anchors</text><text x="440" y="188">Path Graph</text><text x="720" y="188">Visual Corridor</text><text x="1020" y="188">Presentation</text></g><g fill="#aebfe4" font-size="14"><text x="160" y="220">Terrain · Portals</text><text x="160" y="243">Landmarks</text><text x="440" y="220">Nodes · Edges</text><text x="440" y="243">Costs · Constraints</text><text x="720" y="220">Camera · Occlusion</text><text x="720" y="243">Visibility Bounds</text><text x="1020" y="220">Focus · Composition</text><text x="1020" y="243">Scene Feedback</text></g>
<g stroke="url(#gl)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M275 220H320l-8 -8m8 8l-8 8"/><path d="M555 220H600l-8 -8m8 8l-8 8"/><path d="M835 220H880l-8 -8m8 8l-8 8"/></g><text x="600" y="354" fill="#d8e5ff" font-size="17">Path Visual is a VS Engine concept for visual paths and spatial presentation.</text><text x="600" y="387" fill="#9aafd6" font-size="14">It does not mean path tracing or ray tracing; it describes a separate path-and-visibility workflow.</text></g></svg>
